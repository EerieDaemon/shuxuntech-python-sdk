[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shuxuntech"
version = "0.1.0"
description = "数勋科技开放平台 Python SDK：签名鉴权、表单提交、统一响应与强类型模型"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "EerieDaemon" }]
keywords = ["shuxuntech", "sdk", "api", "identity", "ocr", "enterprise"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://shuxuntech.com/"
Repository = "https://github.com/EerieDaemon/shuxuntech-python-sdk"
Documentation = "https://shuxuntech.com/help"
Changelog = "https://github.com/EerieDaemon/shuxuntech-python-sdk/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["build>=1.2", "twine>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shuxuntech = ["py.typed"]

[tool.setuptools]
include-package-data = true
